<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>7 Günlük Ders Programı</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
      position: relative;
    }
    h1 {
      text-align: center;
    }
    .week {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .day {
      background: #fffbea;
      padding: 10px;
      border-radius: 12px;
      width: 220px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      position: relative;
    }
    .day:nth-child(odd) {
      background: #e6f7ff;
    }
    .day h2 {
      font-size: 18px;
      margin-bottom: 10px;
      text-align: center;
    }
    .task-list {
      list-style: none;
      padding: 0;
      min-height: 40px;
    }
    .task-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 0;
      font-size: 14px;
      border-bottom: 1px solid #ddd;
    }
    .task-text {
      flex: 1;
      word-break: break-word;
    }
    .completed {
      text-decoration: line-through;
      color: gray;
    }
    input[type="text"] {
      width: 100%;
      margin-top: 8px;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 5px;
      padding: 6px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    .delete-btn {
      color: red;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      display: none;
    }
    .toggle-icon {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      font-size: 28px;
      text-align: center;
      cursor: pointer;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .toggle-icon:hover {
      background: #0056b3;
    }
    .toplu-ekle-container {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      background-color: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .toplu-ekle-input {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .toplu-ekle-input input {
      width: 220px;
    }
    .toplu-buttons {
      position: fixed;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
    }
    .toplu-buttons button {
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <h1>7 Günlük Ders Programı</h1>

  <div class="toplu-buttons">
    <button onclick="deleteAllTasks()" style="background: red;">Toplu Sil</button>
    <button class="toggle-icon" onclick="toggleAllInputs()">+</button>
  </div>

  <div class="toplu-ekle-container" id="topluEkleInput">
    <input type="text" id="topluTaskInput" placeholder="Tüm günler için görev">
    <button onclick="addTopluTask()">Tüm Günlerde Ekle</button>
  </div>

  <div class="week" id="week"></div>

  <script>
    const days = ["Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar"];
    const weekEl = document.getElementById("week");
    let isEditMode = false;

    function loadTasks(day) {
      return JSON.parse(localStorage.getItem("tasks_" + day)) || [];
    }

    function saveTasks(day, tasks) {
      localStorage.setItem("tasks_" + day, JSON.stringify(tasks));
    }

    function renderDay(day) {
      const dayDiv = document.createElement("div");
      dayDiv.className = "day";
      dayDiv.innerHTML = `
        <h2>${day}</h2>
        <ul class="task-list" id="list-${day}"></ul>
        <div id="input-area-${day}" style="display: ${isEditMode ? 'block' : 'none'};">
          <input type="text" placeholder="Yeni görev" id="input-${day}" />
          <button onclick="addTask('${day}')">Ekle</button>
        </div>
      `;
      weekEl.appendChild(dayDiv);

      const taskList = loadTasks(day);
      const sortedTasks = [...taskList.filter(t => !t.completed), ...taskList.filter(t => t.completed)];

      for (const task of sortedTasks) {
        addTaskToDOM(day, task.text, task.completed);
      }
    }

    function addTask(day) {
      const input = document.getElementById("input-" + day);
      const taskText = input.value.trim();
      if (taskText === "") return;

      const tasks = loadTasks(day);
      const newTask = { text: taskText, completed: false };
      tasks.push(newTask);
      saveTasks(day, tasks);
      input.value = "";
      renderAll();
    }

    function toggleAllInputs() {
      isEditMode = !isEditMode;
      days.forEach(day => {
        const inputArea = document.getElementById("input-area-" + day);
        if (inputArea) inputArea.style.display = isEditMode ? "block" : "none";

        const deleteButtons = document.querySelectorAll(`#list-${day} .delete-btn`);
        deleteButtons.forEach(btn => {
          btn.style.display = isEditMode ? "inline" : "none";
        });
      });

      document.getElementById("topluEkleInput").style.display = isEditMode ? "flex" : "none";
    }

    function addTopluTask() {
      const input = document.getElementById("topluTaskInput");
      const taskText = input.value.trim();
      if (taskText === "") return;
      days.forEach(day => {
        const tasks = loadTasks(day);
        tasks.push({ text: taskText, completed: false });
        saveTasks(day, tasks);
      });
      input.value = "";
      renderAll();
    }

    function deleteAllTasks() {
      if (confirm("Tüm görevleri silmek istediğinizden emin misiniz?")) {
        days.forEach(day => {
          saveTasks(day, []);
        });
        renderAll();
      }
    }

    function addTaskToDOM(day, taskText, completed) {
      const ul = document.getElementById("list-" + day);
      const li = document.createElement("li");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = completed;
      checkbox.addEventListener("change", () => toggleTask(day, taskText));

      const span = document.createElement("span");
      span.textContent = taskText;
      span.className = "task-text" + (completed ? " completed" : "");

      const deleteBtn = document.createElement("span");
      deleteBtn.className = "delete-btn";
      deleteBtn.innerHTML = "&times;";
      deleteBtn.style.display = isEditMode ? "inline" : "none";
      deleteBtn.onclick = () => deleteTask(day, taskText);

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(deleteBtn);

      ul.appendChild(li);
    }

    function toggleTask(day, taskText) {
      const tasks = loadTasks(day);
      const task = tasks.find(t => t.text === taskText);
      if (task) {
        task.completed = !task.completed;
        saveTasks(day, tasks);
        renderAll();
      }
    }

    function deleteTask(day, taskText) {
      let tasks = loadTasks(day);
      tasks = tasks.filter(task => task.text !== taskText);
      saveTasks(day, tasks);
      renderAll();
    }

    function renderAll() {
      weekEl.innerHTML = "";
      days.forEach(renderDay);
    }

    renderAll();
  </script>
</body>
</html>
